# Cloudflare Workers with static assets, for `wrangler deploy` from a terminal
# and from CI (.github/workflows/deploy.yml).
#
# For now the site runs only on workers.dev, as a preview. The console still
# answers on 1billion.clowk.in, so a route on that host would take it over.
# At the cutover, add the route below (on the clowk.in zone, not a Custom
# Domain: a route runs in the normal proxy path of the zone) and set
# workers_dev to false:
#
#   routes = [
#     { pattern = "1billion.clowk.in/*", zone_name = "clowk.in" },
#   ]

name = "1billion-lp"
compatibility_date = "2026-09-01"
workers_dev = true

# The Worker picks the language of / by country (worker/index.ts). It runs
# only for /: every other path is a static file, served with no code.
main = "worker/index.ts"

[assets]
directory = "./out"
binding = "ASSETS"
# / for the language, and the old paths of the console (worker/forward.ts;
# worker/forward.test.ts checks that this list has each one).
run_worker_first = [
  "/",
  "/send",
  "/send/*",
  "/messages",
  "/messages/*",
  "/validate",
  "/validate/*",
  "/suppressions",
  "/suppressions/*",
  "/openapi.yml",
  "/unsubscribe",
  "/unsubscribe/*",
  "/unsubscribes",
  "/unsubscribes/*",
  "/webhooks",
  "/webhooks/*",
  "/account",
  "/account/*",
  "/apps",
  "/apps/*",
  "/clowk",
  "/clowk/*",
  "/connect",
  "/connect/*",
  "/credits",
  "/credits/*",
  "/domains",
  "/domains/*",
  "/emails",
  "/emails/*",
  "/invites",
  "/invites/*",
  "/login",
  "/login/*",
  "/members",
  "/members/*",
  "/oauth",
  "/oauth/*",
  "/settings",
  "/settings/*",
  "/sign_in",
  "/sign_in/*",
  "/sign_out",
  "/sign_out/*",
  "/sign_up",
  "/sign_up/*",
  "/start",
  "/start/*",
  "/usage",
  "/usage/*",
  "/validation",
  "/validation/*",
  "/workspaces",
  "/workspaces/*",
]
# `trailingSlash: true` exports /terms/index.html, and this serves it at /terms/.
html_handling = "auto-trailing-slash"
# The not-found page that `next build` writes to out/404.html.
not_found_handling = "404-page"
